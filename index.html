/* ==========================================================================
   ROUTER
   ========================================================================== */
const SCREENS = {
  'login': screenLogin,
  '': screenDashboard,
  'accounts': screenAccounts,
  'account': screenAccountDetail,
  'transfer': (p) => ({
    home:screenTransferHome, type:screenTransferType, method:screenTransferMethod,
    beneficiary:screenTransferBeneficiary, source_account:screenTransferSource,
    amount:screenTransferAmount, fees:screenTransferFees,
    confirmation:screenTransferConfirmation, otp:screenTransferOtp,
    processing:screenTransferProcessing, success:screenTransferSuccess
  }[p.step || 'home'] || screenTransferHome)(p),
  'beneficiaries': screenBeneficiaries,
  'beneficiaries/new': screenBeneficiaryNew,
  'cards': screenCards,
  'card': screenCardDetail,
  'cards/new': screenCreateVirtualCard,
  'crypto': screenCrypto,
  'more': screenMore,
  'services': screenServices,
  'services/cat': screenServiceCategory,
  'history': screenHistory,
  'transaction': screenTransactionDetail,
  'receipt': screenReceipt,
  'notifications': screenNotifications,
  'profile': screenProfile,
  'profile/edit': screenProfileEdit,
  'security': screenSecurity,
  'settings': screenSettings,
  'settings/language': screenSettingsLanguage,
  'settings/theme': screenSettingsTheme,
  'kyc': screenKyc,
  'help': screenHelp
};

function parseHash(){
  let h = (location.hash || '#/').slice(1);
  if (!h) h = '/';
  return h.split('/').filter(Boolean);
}

function route(){
  const parts = parseHash();
  const isAuth = SessionEngine.isAuthenticated();

  if (!isAuth && parts[0] !== 'login'){
    if (location.hash !== '#/login'){ location.hash = '#/login'; return; }
  }
  if (isAuth && parts[0] === 'login'){
    if (location.hash !== '#/'){ location.hash = '#/'; return; }
  }

  let key, params = {};
  if (parts.length === 0){ key = ''; }
  else if (parts[0] === 'login'){ key = 'login'; }
  else if (parts[0] === 'account' && parts[1]){ key = 'account'; params.id = parts[1]; }
  else if (parts[0] === 'accounts'){ key = 'accounts'; }
  else if (parts[0] === 'transfer'){ key = 'transfer'; params.step = parts[1] || 'home'; }
  else if (parts[0] === 'beneficiaries' && parts[1] === 'new'){ key = 'beneficiaries/new'; }
  else if (parts[0] === 'beneficiaries'){ key = 'beneficiaries'; }
  else if (parts[0] === 'cards' && parts[1] === 'new'){ key = 'cards/new'; }
  else if (parts[0] === 'card' && parts[1]){ key = 'card'; params.id = parts[1]; }
  else if (parts[0] === 'cards'){ key = 'cards'; }
  else if (parts[0] === 'crypto'){ key = 'crypto'; }
  else if (parts[0] === 'more'){ key = 'more'; }
  else if (parts[0] === 'services' && parts[1]){ key = 'services/cat'; params.cat = parts[1]; }
  else if (parts[0] === 'services'){ key = 'services'; }
  else if (parts[0] === 'history'){ key = 'history'; }
  else if (parts[0] === 'transaction' && parts[1]){ key = 'transaction'; params.id = parts[1]; }
  else if (parts[0] === 'receipt' && parts[1]){ key = 'receipt'; params.id = parts[1]; }
  else if (parts[0] === 'notifications'){ key = 'notifications'; }
  else if (parts[0] === 'profile' && parts[1] === 'edit'){ key = 'profile/edit'; }
  else if (parts[0] === 'profile'){ key = 'profile'; }
  else if (parts[0] === 'security'){ key = 'security'; }
  else if (parts[0] === 'settings' && parts[1] === 'language'){ key = 'settings/language'; }
  else if (parts[0] === 'settings' && parts[1] === 'theme'){ key = 'settings/theme'; }
  else if (parts[0] === 'settings'){ key = 'settings'; }
  else if (parts[0] === 'kyc'){ key = 'kyc'; }
  else if (parts[0] === 'help'){ key = 'help'; }
  else { key = isAuth ? '' : 'login'; }

  // le tunnel de transfert ne peut pas être rejoué à l'aveugle (refresh, retour, URL directe)
  if (key === 'transfer'){
    const redirect = transferGuard(params.step);
    if (redirect && redirect !== location.hash){ location.hash = redirect; return; }
  }

  const screen = SCREENS[key] || (isAuth ? screenDashboard : screenLogin);
  const root = document.getElementById('ovy-app');
  root.innerHTML = screen(params);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
  window.scrollTo(0,0);
  attachHandlers(key, params);
}

/* ==========================================================================
   HANDLERS (attachés au DOM fraîchement rendu — rien n'est attaché à document/html)
   ========================================================================== */
async function runProcessing(){
  const started = Date.now();
  try {
    const receipt = await TransferEngine.commit();
    const wait = Math.max(0, 1100 - (Date.now() - started));
    if (wait) await new Promise(r => setTimeout(r, wait));
    const tx = TransactionEngine.getById(receipt.transactionId);
    if (tx){
      PresentationQueue.enqueue({
        id: tx.id, title: t('transfer.success'),
        phone: tx.beneficiaryPhone || '',
        maskedName: tx.beneficiaryMaskedName || '',
        amount: Money.format(tx.amount, tx.currency),
        transactionId: tx.id
      });
    }
    if (location.hash === '#/transfer/processing') go('#/transfer/success');
  } catch (e){
    toast(errText(e));
    if (location.hash === '#/transfer/processing') go('#/transfer/confirmation');
  }
}

function attachHandlers(key, params){
  // ---- Login
  const loginBtn = document.getElementById('login-btn');
  if (loginBtn){
    const pw = document.getElementById('login-password');
    const ph = document.getElementById('login-phone');
    let busy = false;
    const submit = async () => {
      if (busy) return;
      const phone = (ph.value || '').trim();
      const pass  = pw.value || '';
      if (phone === PRIMARY_ACCOUNT.phone && pass === PRIMARY_ACCOUNT.password){
        busy = true;
        LoadingManager.start('login');
        await SessionEngine.login(phone);
        LoadingManager.stop('login');
        go('#/');
      } else {
        document.getElementById('login-err').textContent = t('login.error');
      }
    };
    loginBtn.addEventListener('click', submit);
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    ph.addEventListener('keydown', e => { if (e.key === 'Enter') pw.focus(); });
    document.getElementById('login-eye').addEventListener('click', e => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = svg(show ? 'eyeoff' : 'eye', 20);
    });
    document.querySelectorAll('[data-unavailable]').forEach(b => b.addEventListener('click', () => toast(t('errors.PROVIDER_UNAVAILABLE'))));
    return;
  }

  // ---- Header back
  document.querySelectorAll('[data-nav]').forEach(b => {
    b.addEventListener('click', () => go(b.getAttribute('data-nav')));
  });

  // ---- Dashboard
  const eye = document.querySelector('[data-toggle-balance]');
  if (eye) eye.addEventListener('click', async () => {
    await StorageEngine.set('settings', { ...settingsGet(), hideBalance: !settingsGet().hideBalance });
    route();
  });

  // ---- History / notifications filters
  document.querySelectorAll('[data-hf]').forEach(b => b.addEventListener('click', () => { historyFilter = b.getAttribute('data-hf'); route(); }));
  document.querySelectorAll('[data-nf]').forEach(b => b.addEventListener('click', () => { notifFilter = b.getAttribute('data-nf'); route(); }));

  // ---- Notifications
  const markAll = document.getElementById('notif-mark-all');
  if (markAll) markAll.addEventListener('click', async () => { await NotificationEngine.markAllAsRead(); route(); });
  document.querySelectorAll('[data-notif]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-notif');
      const n = NotificationEngine.getById(id);
      if (!n) return;
      await NotificationEngine.markAsRead(id);
      if (n.transactionId) go('#/transaction/' + n.transactionId);
      else route();
    });
  });

  // ---- Transfer : type / méthode
  document.querySelectorAll('[data-tt]').forEach(b => b.addEventListener('click', () => {
    try { TransferEngine.setType(b.getAttribute('data-tt')); go('#/transfer/method'); }
    catch (e){ toast(errText(e)); }
  }));
  document.querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
    try { TransferEngine.setMethod(b.getAttribute('data-tm')); go('#/transfer/beneficiary'); }
    catch (e){ toast(errText(e)); }
  }));

  // ---- Transfer : bénéficiaire (validation → recherche → reconnaissance → résultat)
  document.querySelectorAll('[data-tb]').forEach(b => b.addEventListener('click', () => {
    const ben = BeneficiaryEngine.getById(b.getAttribute('data-tb'));
    if (!ben) return;
    try { TransferEngine.setBeneficiary(ben); go('#/transfer/source_account'); }
    catch (e){ toast(errText(e)); }
  }));
  const tPhone = document.getElementById('t-phone');
  if (tPhone){
    const box = document.getElementById('t-recog');
    const next = document.getElementById('t-ben-next');
    const dots = '<div class="ovy-recog__ring"></div>';
    let timer = null, found = null, seq = 0;
    const show = (html, cls) => { box.className = 'ovy-recog ' + cls; box.innerHTML = html; };
    tPhone.addEventListener('input', () => {
      clearTimeout(timer);
      const my = ++seq;
      found = null; next.disabled = true;
      const v = tPhone.value.trim();
      if (v.length < 4){ show('', 'is-empty'); return; }
      show(dots + '<div class="ovy-recog__label">' + esc(t('transfer.searching')) + '</div>', '');
      timer = setTimeout(() => {
        if (my !== seq) return;
        show(dots + '<div class="ovy-recog__label">' + esc(t('transfer.recognizing')) + '</div>', '');
        timer = setTimeout(() => {
          if (my !== seq) return;
          const r = BeneficiaryEngine.resolve(v);
          if (r.state === 'found'){
            found = r.data; next.disabled = false;
            show('<div class="ovy-recog__icon">' + svg('check', 22, 3) + '</div>' +
              '<div class="ovy-grow"><div class="ovy-recog__label">' + esc(t('transfer.found')) + '</div>' +
              '<div class="ovy-recog__name">' + esc(r.maskedName) + '</div>' +
              '<div class="ovy-recog__phone ovy-num">' + esc(r.data.phoneRaw || r.data.phone) + '</div></div>', 'is-found');
          } else {
            show('<div class="ovy-recog__icon ovy-recog__icon--err">' + svg('close', 22, 3) + '</div>' +
              '<div class="ovy-grow"><div class="ovy-recog__name" style="font:var(--f-btn)">' + esc(t('transfer.notFound')) + '</div>' +
              '<div class="ovy-recog__phone">' + esc(t('transfer.checkNumber')) + '</div>' +
              '<button class="ovy-btn ovy-btn--secondary ovy-btn--sm" style="margin-top:10px" data-add-ben>' + esc(t('beneficiaries.add')) + '</button></div>', 'is-missing');
          }
        }, 350);
      }, 350);
    });
    box.addEventListener('click', e => {
      if (!e.target.closest('[data-add-ben]')) return;
      pendingBen = { phone: tPhone.value.trim(), returnTo: '#/transfer/beneficiary' };
      go('#/beneficiaries/new');
    });
    next.addEventListener('click', () => {
      if (!found) return;
      try { TransferEngine.setBeneficiary(found); go('#/transfer/source_account'); }
      catch (e){ toast(errText(e)); }
    });
  }

  // ---- Transfer : compte source / montant / frais / confirmation
  document.querySelectorAll('[data-tsa]').forEach(b => b.addEventListener('click', () => {
    try { TransferEngine.setSourceAccount(b.getAttribute('data-tsa')); go('#/transfer/amount'); }
    catch (e){ toast(errText(e)); }
  }));
  const tAmount = document.getElementById('t-amount');
  if (tAmount){
    const parse = () => parseFloat(String(tAmount.value).replace(',', '.'));
    const errBox = document.getElementById('t-amount-err');
    const prev = document.getElementById('t-fee-preview');
    const cur = TransferEngine.getState().sourceCurrency || 'OMR';
    tAmount.addEventListener('input', () => {
      errBox.textContent = '';
      const v = parse();
      prev.textContent = Money.format(v > 0 ? TransferEngine.previewFee(v) : 0, cur);
    });
    const submitAmount = () => {
      const v = parse();
      try {
        TransferEngine.setAmount(v);
        const { total } = TransferEngine.calculateFees();
        const acc = AccountEngine.getById(TransferEngine.getState().sourceAccountId);
        if (!acc || !Money.gte(acc.availableBalance, total, cur)){ errBox.textContent = t('errors.INSUFFICIENT_BALANCE'); return; }
        go('#/transfer/fees');
      } catch (e){ errBox.textContent = errText(e); }
    };
    document.getElementById('t-amount-next').addEventListener('click', submitAmount);
    tAmount.addEventListener('keydown', e => { if (e.key === 'Enter') submitAmount(); });
    if (tAmount.value) tAmount.dispatchEvent(new Event('input'));
  }
  const tFeesNext = document.getElementById('t-fees-next');
  if (tFeesNext) tFeesNext.addEventListener('click', () => go('#/transfer/confirmation'));

  const tConfirm = document.getElementById('t-confirm');
  if (tConfirm){
    tConfirm.addEventListener('click', () => {
      try { TransferEngine.confirm(); go('#/transfer/otp'); }
      catch (e){ toast(errText(e)); }
    });
  }

  // ---- OTP (les données du transfert ne sont jamais perdues sur une erreur)
  const otpDots = document.getElementById('otp-dots');
  if (otpDots){
    let code = '', busy = false;
    const update = () => { otpDots.querySelectorAll('i').forEach((d,i) => d.classList.toggle('on', i < code.length)); };
    document.querySelectorAll('[data-key]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (busy) return;
        const k = btn.getAttribute('data-key');
        document.getElementById('otp-err').textContent = '';
        if (k === 'del'){ code = code.slice(0,-1); update(); return; }
        if (code.length >= 6) return;
        code += k; update();
        if (code.length === 6){
          busy = true;
          const r = TransferEngine.verifyOTP(code);
          if (r.ok){ go('#/transfer/processing'); return; }
          document.getElementById('otp-err').textContent = t('errors.INVALID_OTP');
          otpDots.classList.remove('ovy-shake'); void otpDots.offsetWidth; otpDots.classList.add('ovy-shake');
          setTimeout(() => { code = ''; update(); busy = false; }, 320);
        }
      });
    });
  }

  // ---- Processing : le commit est déclenché ici, une seule fois par affichage, et il est idempotent
  if (key === 'transfer' && params.step === 'processing') runProcessing();

  // ---- Beneficiary new
  const bSave = document.getElementById('b-save');
  if (bSave){
    bSave.addEventListener('click', async () => {
      const err = document.getElementById('b-err');
      err.textContent = '';
      try {
        await BeneficiaryEngine.add({
          name: document.getElementById('b-name').value,
          phone: document.getElementById('b-phone').value,
          accountNumber: document.getElementById('b-account').value || null,
          iban: document.getElementById('b-iban').value || null,
          bank: document.getElementById('b-bank').value || null,
          country: document.getElementById('b-country').value || null,
          currency: document.getElementById('b-currency').value
        });
        const dest = pendingBen ? pendingBen.returnTo : '#/beneficiaries';
        pendingBen = null;
        go(dest);
      } catch (e){
        err.textContent = errText(e);
      }
    });
  }
  if (key !== 'beneficiaries/new' && key !== 'transfer' && pendingBen) pendingBen = null;

  // ---- Cards
  document.querySelectorAll('[data-card-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const a = btn.getAttribute('data-card-action');
      const id = btn.closest('[data-card-id]').getAttribute('data-card-id');
      try {
        if (a === 'activate') await CardEngine.activate(id);
        if (a === 'freeze')   await CardEngine.freeze(id);
        if (a === 'unfreeze') await CardEngine.unfreeze(id);
        if (a === 'close')    await CardEngine.close(id);
        route();
      } catch (e){ toast(errText(e)); }
    });
  });
  const cvCreate = document.getElementById('cv-create');
  if (cvCreate){
    cvCreate.addEventListener('click', async () => {
      const holder = document.getElementById('cv-holder').value.trim();
      const cur = document.getElementById('cv-currency').value;
      if (!holder){ document.getElementById('cv-holder').setAttribute('aria-invalid', 'true'); return; }
      try { await CardEngine.createVirtual({ currency: cur, holderName: holder }); go('#/cards'); }
      catch (e){ toast(errText(e)); }
    });
  }

  // ---- Crypto
  document.querySelectorAll('[data-crypto-create]').forEach(b => b.addEventListener('click', async () => {
    try { await CryptoEngine.createWallet(b.getAttribute('data-crypto-create')); toast(t('crypto.walletCreated')); route(); }
    catch (e){ toast(errText(e)); }
  }));

  // ---- Profile
  const pSave = document.getElementById('p-save');
  if (pSave){
    pSave.addEventListener('click', async () => {
      await ProfileEngine.update({
        firstName: document.getElementById('p-first').value.trim(),
        lastName: document.getElementById('p-last').value.trim(),
        displayName: document.getElementById('p-disp').value.trim(),
        email: document.getElementById('p-email').value.trim(),
        phone: document.getElementById('p-phone').value.trim(),
        country: document.getElementById('p-country').value.trim()
      });
      go('#/profile');
    });
  }
  const logoutBtn = document.getElementById('profile-logout');
  if (logoutBtn) logoutBtn.addEventListener('click', async () => {
    await SessionEngine.logout();
    TransferEngine.reset();
    go('#/login');
  });

  // ---- Security
  const secSetPin = document.getElementById('sec-set-pin');
  if (secSetPin) secSetPin.addEventListener('click', async () => {
    const pin = await askPin();
    if (!pin) return;
    try { await SecurityEngine.setPin(pin); toast(t('security.pinSet')); }
    catch (e){ toast(errText(e)); }
  });
  const secEvents = document.getElementById('sec-events');
  if (secEvents) secEvents.addEventListener('click', () => toast(t('errors.PROVIDER_UNAVAILABLE')));

  // ---- Settings
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', async () => {
    const l = b.getAttribute('data-lang');
    currentLang = l;
    await StorageEngine.set('settings', { ...settingsGet(), language: l });
    route();
  }));
  document.querySelectorAll('[data-set-theme]').forEach(b => b.addEventListener('click', async () => {
    const th = b.getAttribute('data-set-theme');
    await StorageEngine.set('settings', { ...settingsGet(), theme: th });
    ThemeEngine.apply(th);
    route();
  }));

  // ---- KYC
  const kStart = document.getElementById('kyc-start');
  if (kStart) kStart.addEventListener('click', async () => { await KycEngine.start(); route(); });
  const readKyc = () => ({
    firstName: document.getElementById('k-first').value.trim(),
    lastName: document.getElementById('k-last').value.trim(),
    dateOfBirth: document.getElementById('k-dob').value || null,
    nationality: document.getElementById('k-nat').value.trim() || null,
    address: document.getElementById('k-addr').value.trim() || null
  });
  const kSave = document.getElementById('kyc-save');
  if (kSave) kSave.addEventListener('click', async () => {
    try { await KycEngine.updateDraft(readKyc()); toast(t('action.save')); }
    catch (e){ toast(errText(e)); }
  });
  const kSubmit = document.getElementById('kyc-submit');
  if (kSubmit) kSubmit.addEventListener('click', async () => {
    try { await KycEngine.updateDraft(readKyc()); await KycEngine.submit(); route(); }
    catch (e){ toast(errText(e)); }
  });

  // ---- Receipt share
  const rcShare = document.getElementById('rc-share');
  if (rcShare) rcShare.addEventListener('click', async () => {
    const tx = TransactionEngine.getById(params.id);
    if (!tx) return;
    const text = 'OVY Wallet\n' + tx.reference + '\n' + Money.format(tx.amount, tx.currency);
    if (navigator.share){ try { await navigator.share({ title:'OVY Receipt', text }); } catch {} }
    else if (navigator.clipboard){ try { await navigator.clipboard.writeText(text); toast(t('action.copied')); } catch {} }
  });
}

/* ==========================================================================
   STARTUP
   ========================================================================== */
const STARTUP_TASKS = [
  { label:'Storage',     run: async () => { await StorageEngine.init(); } },
  { label:'Migration',   run: async () => { await StorageEngine.migrate(); } },
  { label:'Settings',    run: async () => {
      const s = settingsGet();
      currentLang = s.language || (navigator.language || 'fr').slice(0,2);
      if (!['fr','en','ar'].includes(currentLang)) currentLang = 'fr';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      ThemeEngine.apply(s.theme || 'system');
  }},
  { label:'Accounts',    run: async () => { await AccountEngine.ensureDefaults(); } },
  { label:'Profile',     run: async () => { ProfileEngine.get(); } },
  { label:'Ready',       run: async () => {} }
];

async function boot(){
  document.getElementById('ovy-boot-brand').innerHTML = lockup(60);
  const fill = document.getElementById('ovy-boot-fill');
  const label = document.getElementById('ovy-boot-label');
  const tag = document.getElementById('ovy-boot-tag');
  tag.textContent = t('boot.tagline');
  for (let i = 0; i < STARTUP_TASKS.length; i++){
    const task = STARTUP_TASKS[i];
    label.textContent = task.label;
    fill.style.width = Math.round((i / STARTUP_TASKS.length) * 100) + '%';
    await task.run();
    if (i === 2){ tag.textContent = t('boot.tagline'); }
  }
  label.textContent = t('boot.loading');
  fill.style.width = '100%';
  await new Promise(r => setTimeout(r, 180));
  document.getElementById('ovy-boot').classList.add('is-hidden');

  EventBus.on('unreadChanged', () => {
    if (location.hash === '#/notifications' || location.hash === '#/' || location.hash === '') route();
  });
  if (window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if ((settingsGet().theme || 'system') === 'system') ThemeEngine.apply('system'); };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
  }

  window.addEventListener('hashchange', route);
  route();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
